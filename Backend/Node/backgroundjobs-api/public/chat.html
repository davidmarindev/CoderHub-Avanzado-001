<!-- public/chat.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Chat grupal – WebSockets</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 1rem auto; }
    #messages { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: .5rem; }
    .msg { margin-bottom: .25rem; }
    .msg .user { font-weight: bold; }
    .system { color: #888; font-style: italic; }
  </style>
</head>
<body>
  <h1>Chat grupal (demo WebSockets)</h1>

  <div>
    <label>Nombre de usuario:</label>
    <input id="username" placeholder="Tu nombre" />
    <button id="btnJoin">Entrar al chat</button>
  </div>

  <div id="chatArea" style="display:none; margin-top:1rem;">
    <div id="messages"></div>
    <form id="form" style="margin-top:.5rem;">
      <input id="input" autocomplete="off" placeholder="Escribe un mensaje..." style="width:80%;" />
      <button>Enviar</button>
    </form>
  </div>

  <!-- Cliente de Socket.IO servido por el backend -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io() // se conecta al mismo host:puerto del backend

    const usernameInput = document.getElementById('username')
    const btnJoin = document.getElementById('btnJoin')
    const chatArea = document.getElementById('chatArea')
    const messagesDiv = document.getElementById('messages')
    const form = document.getElementById('form')
    const input = document.getElementById('input')

    let joined = false

    function addMessage(text, user, isSystem = false) {
      const div = document.createElement('div')
      div.className = 'msg' + (isSystem ? ' system' : '')
      if (isSystem) {
        div.textContent = text
      } else {
        const strong = document.createElement('span')
        strong.className = 'user'
        strong.textContent = user + ': '
        div.appendChild(strong)
        div.appendChild(document.createTextNode(text))
      }
      messagesDiv.appendChild(div)
      messagesDiv.scrollTop = messagesDiv.scrollHeight
    }

    btnJoin.addEventListener('click', () => {
      const username = usernameInput.value.trim() || 'Anon'
      socket.emit('chat:join', username)
      joined = true
      chatArea.style.display = 'block'
      usernameInput.disabled = true
      btnJoin.disabled = true
    })

    // Enviar mensaje
    form.addEventListener('submit', (e) => {
      e.preventDefault()
      if (!joined) return
      const text = input.value.trim()
      if (!text) return
      socket.emit('chat:message', text)
      input.value = ''
    })

    // Historial inicial
    socket.on('chat:history', (msgs) => {
      msgs.forEach(msg => addMessage(msg.message, msg.username))
    })

    // Mensaje normal
    socket.on('chat:message', (msg) => {
      addMessage(msg.message, msg.username)
    })

    // Mensaje de sistema
    socket.on('chat:system', (msg) => {
      console.log('Mensaje de sistema:', msg)
      addMessage(msg.message, null, true)
    })
  </script>
</body>
</html>
